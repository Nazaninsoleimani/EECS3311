# AI Study and Learning Agent - example configuration (copy to application.properties)
# Values are planned defaults from the Stage 1 design and will be calibrated in Stage 2.

# LLM provider: gemini | openai   (selects GeminiLLMAdapter or OpenAILLMAdapter)
llm.provider=gemini
llm.model=CONFIGURE_MODEL_NAME
llm.temperature=0.3
llm.maxTokens=2048
llm.timeoutSeconds=60

# Retrieval (RetrievalService, Chunker)
retrieval.topK=5
retrieval.minScore=0.55
chunker.chunkSize=800
chunker.overlap=100

# Agent
agent.maxValidationRetries=1
memory.session.maxTurns=20

# Progress and adaptation
mastery.alpha=0.3
mastery.weakThreshold=0.5
mastery.masteredThreshold=0.8
adaptive.promoteAfterCorrect=3
adaptive.demoteAfterIncorrect=2

# Storage
storage.sqlite.path=${user.home}/.study-agent/study-agent.db

# Reminders
reminders.dispatchIntervalSeconds=60
