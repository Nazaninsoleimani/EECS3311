apply plugin: 'application'

base { archivesName = 'study-agent-gui' }

dependencies {
    implementation project(':backend')
    // modern flat look and feel with light and dark themes
    implementation 'com.formdev:flatlaf:3.5.1'
}

application {
    mainClass = 'ca.yorku.eecs3311.studyagent.presentation.gui.StudyAgentGui'
}

run { workingDir = rootProject.projectDir }

// views are built without a window in tests
test { systemProperty 'java.awt.headless', 'true' }
